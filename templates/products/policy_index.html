{% extends 'base.html' %}
{% block title %}All Policies | GramKart{% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto px-4 sm:px-6 py-12">
    <h1 class="text-3xl sm:text-4xl font-heading font-bold text-slate-900 mb-8">Startup India &amp; E-commerce Policies</h1>
    <div class="grid md:grid-cols-2 gap-6">
    {% for group, items in groups.items %}
        <div class="bg-white border border-slate-200 rounded-3xl p-6">
            <h2 class="font-heading text-xl font-bold mb-4">{{ group }}</h2>
            <ul class="space-y-2 text-sm">{% for s, t in items %}<li><a class="text-slate-700 hover:text-indigo-600" href="{% url 'products:policy' s %}">{{ t }}</a></li>{% endfor %}</ul>
        </div>
    {% endfor %}
    </div>
</div>
{% endblock %}
