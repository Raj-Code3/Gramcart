{% extends 'base.html' %}
{% load static %}

{% block title %}Sign In | GramKart{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12">
    <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200 p-8 sm:p-10 shadow-xl space-y-6">
        
        <div class="text-center">
            <div class="w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center mx-auto mb-3 text-white text-xl shadow-lg shadow-indigo-600/30">
                <i class="bi bi-box-seam"></i>
            </div>
            <h1 class="text-2xl font-extrabold font-heading text-slate-900">Sign in to GramKart</h1>
            <p class="text-xs text-slate-500 mt-1">Access your saved orders, wishlist, and fast checkout</p>
        </div>

        <form method="POST" action="{% url 'accounts:login' %}" class="space-y-4">
            {% csrf_token %}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Username</label>
                <input 
                    type="text" 
                    name="username" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 outline-none text-sm transition"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
                </div>
                <input 
                    type="password" 
                    name="password" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 outline-none text-sm transition"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-extrabold text-sm shadow-xl shadow-indigo-600/30 transition flex items-center justify-center gap-2">
                Sign In
            </button>
        </form>

        <div class="relative flex py-1 items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink mx-4 text-xs text-slate-400 font-bold uppercase">New to GramKart?</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <a href="{% url 'accounts:register' %}" class="block text-center w-full py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-2xl font-bold text-xs transition">
            Create Your GramKart Account
        </a>

    </div>
</div>
{% endblock %}
